name: 🚀 Release CLI (PyPI)

on:
  release:
    types: [published]

# PyPI wheel ships giswater_admin only (no dbmodel/). Schema CI belongs on
# plugin releases (vX.Y.Z) and PRs touching dbmodel/** — not cli-v* tags.

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'cli-v')
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Extract and validate CLI version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^cli-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag $TAG must match cli-vX.Y.Z"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PYPROJECT="$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          MODULE="$(grep -E '^__version__ = ' giswater_admin/__version__.py | sed 's/__version__ = "\(.*\)"/\1/')"

          if [[ "$PYPROJECT" != "$VERSION" ]]; then
            echo "::error::pyproject.toml version ($PYPROJECT) != tag ($VERSION)"
            exit 1
          fi
          if [[ "$MODULE" != "$VERSION" ]]; then
            echo "::error::giswater_admin/__version__.py ($MODULE) != tag ($VERSION)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          python3 -m pip install pytest

      # test/engine is a package under the QGIS plugin repo. Collecting it
      # imports repo-root __init__.py. That file must not require qgis
      # (0.4.1 never reached PyPI: ModuleNotFoundError: qgis).
      - name: Run CLI tests
        run: python3 -m pytest test/cli/ test/engine/ -q --import-mode=importlib

      - name: Install build tools
        run: python3 -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python3 -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: giswater-cli-dist
          path: dist/
